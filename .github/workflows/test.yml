name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv sync --group dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

      - name: ty
        run: uv run ty check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The full supported range: 3.11 is the floor both ruff and ty target,
        # 3.14 is what the dev environment runs (.python-version).
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install
        run: uv sync --group dev --python ${{ matrix.python-version }}

      - name: Test
        # The alignment suite compares every function against the vendored
        # official implementation, so a numeric regression fails here.
        #
        # `uv run` re-resolves the interpreter from .python-version unless
        # told otherwise, which would silently rebuild the environment the
        # Install step just made -- without the dev group, hence without
        # pytest. Naming both keeps the step self-sufficient.
        run: >
          uv run --python ${{ matrix.python-version }} --group dev
          pytest tests/ --cov=bbobax --cov-report=term-missing
