name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --extra dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

      - name: ty
        run: uv run ty check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The full supported range: 3.11 is the floor both ruff and ty target,
        # 3.14 is what the dev environment runs (.python-version).
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Test
        # The alignment suite compares every function against the vendored
        # official implementation, so a numeric regression fails here.
        run: uv run pytest tests/ --cov=bbobax --cov-report=term-missing

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --extra dev --extra notebooks

      - name: Execute notebooks
        # Every notebook is documentation that has to keep working. The %pip
        # cells are skipped: the environment is already installed.
        run: uv run python scripts/run_notebooks.py
