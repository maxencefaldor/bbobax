[project]
name = "bbobax"
version = "0.2.2"
description = "BBOBax: Accelerated Black-Box Optimization Benchmark."
authors = [{ name="Maxence Faldor", email="maxencefaldor@gmail.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
	"jax>=0.8.0",
	"flax>=0.12.0",
]
keywords = [
	"benchmark",
	"bbob",
	"black-box optimization",
	"quality-diversity",
]
classifiers = [
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"License :: OSI Approved :: MIT License",
	"Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
	"pytest",
	"pytest-cov",
	"ruff",
	"ty",
	"nbclient",  # executes the notebooks in CI
]
docs = [
	"mkdocs",
	"mkdocs-material",
	"mkdocstrings[python]",
	"mkdocs-jupyter",
]
notebooks = [
	"ipykernel",
	"ipywidgets",
	"evosax",
	"scikit-learn",
	"mediapy",
]

[project.urls]
Homepage = "https://github.com/maxencefaldor/bbobax"
Documentation = "https://maxencefaldor.github.io/bbobax/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
src = ["src", "tests"]
# The oldest Python we support: ruff modernizes only as far as this, so it
# cannot suggest syntax that breaks a 3.11 user. The dev environment runs on
# 3.14 (see .python-version) -- the tools run new, they validate old.
target-version = "py311"
# Vendored official BBOB implementation (test ground truth): never lint or
# reformat it. Top-level exclude covers both `ruff check` and `ruff format`.
extend-exclude = ["tests/_official/bbobbenchmarks.py"]

[tool.ruff.lint]
select = ["E", "D", "F", "I", "N", "SIM", "UP", "W"]
ignore = [
	"D203",  # incorrect-blank-line-before-class
	"D206",  # docstring-tab-indentation
	"D213",  # multi-line-summary-second-line
	"N803",  # non-lowercase-variable-in-function
	"N806",  # invalid-argument-name
	"W191",  # tab-indentation
]

[tool.ruff.lint.per-file-ignores]
"**/*.ipynb" = [
	"F811",  # redefined-while-unused
]

[tool.ty.environment]
# Type-check against the oldest Python we support, not the one we run on, so a
# 3.11 user cannot hit syntax or typing we only validated on 3.14.
python-version = "3.11"

[tool.ty.src]
include = ["src", "tests", "scripts"]
exclude = [
	"tests/_official",  # vendored ground truth, not ours to type
]
